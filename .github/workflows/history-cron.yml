name: Update Daily History

on:
  schedule:
    - cron: '0 22 * * *' # Ejecutar todos los días a las 22:00 UTC
  workflow_dispatch:       # Permite ejecución manual desde la pestaña Actions

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - name: Call History API Route
        run: |
          curl -X GET "${{ secrets.ROUTE_HISTORY_URL }}" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
